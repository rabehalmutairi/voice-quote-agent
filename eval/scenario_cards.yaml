  replies:
    greeting: "مرحبًا بكم. للمبيعات اضغط واحد، وللدعم اضغط اثنين."
  fallback: ""

no_answer:
  category: stock_check
  request: "هل ماك بوك إير M4 موجود في حي الملقا؟"
