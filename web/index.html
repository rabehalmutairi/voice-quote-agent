<!doctype html>
<html lang="ar-SA" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/noto-sans-arabic-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <meta
      name="description"
      content="وسيط وكيل ذكي يتصل بالمحلات عنك، ويجيب لك مقارنة واضحة مع دليل من كلام كل محل."
    />
    <title>وسيط · wasset.ai · وكيلك الذكي للاتصال بالمحلات</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/wasset-icon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        const savedTheme = window.localStorage.getItem("voice-quote-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch {
        // Keep the dark default when storage is unavailable.
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
